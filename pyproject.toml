[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "espmpui"
version = "0.1.0"
description = "Reactive Web Micro-Framework & Device Management Toolkit for MicroPython (ESP32 & Pico W)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "csseeker", email = "shripad.learn@gmail.com" }
]
requires-python = ">=3.8"
keywords = ["micropython", "esp32", "pico-w", "framework", "dashboard", "iot", "websocket", "webui", "reactive", "captive-portal", "ota"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/csseeker/espmpui"
Documentation = "https://github.com/csseeker/espmpui/tree/main/docs"
Repository = "https://github.com/csseeker/espmpui.git"
Issues = "https://github.com/csseeker/espmpui/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mpremote>=1.20.0",
    "certifi>=2024.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# MicroPython runtime viper builtins (ptr8, ptr16, micropython)
"examples/02_sensor_telemetry.py" = ["F821"]
